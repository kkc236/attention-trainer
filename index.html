<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>注意力训练中心</title>
<style>
:root{--pri:#6366f1;--priL:#818cf8;--ok:#22c55e;--err:#ef4444;--warn:#f59e0b;--bg:#0f172a;--card:#1e293b;--hv:#334155;--tx:#f1f5f9;--tm:#94a3b8;--bd:#334155;--r:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
body::before{content:"";position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 20% 50%,rgba(99,102,241,.12) 0%,transparent 50%),radial-gradient(circle at 80% 20%,rgba(139,92,246,.08) 0%,transparent 50%);animation:bf 20s ease-in-out infinite;z-index:-1}
@keyframes bf{0%,100%{transform:translate(0,0)}50%{transform:translate(2%,-2%)}}
.hdr{text-align:center;padding:36px 20px 14px}
.hdr h1{font-size:2.3rem;font-weight:700;background:linear-gradient(135deg,#818cf8,#c084fc,#818cf8);background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:gs 3s ease infinite}
@keyframes gs{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.hdr p{color:var(--tm);font-size:.92rem;margin-top:4px}
.sb{display:flex;justify-content:center;gap:14px;padding:14px 20px;flex-wrap:wrap}
.si{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 20px;text-align:center;min-width:110px;transition:transform .2s}
.si:hover{transform:translateY(-2px)}
.sv{font-size:1.5rem;font-weight:700;color:var(--priL)}
.sl{font-size:.78rem;color:var(--tm);margin-top:2px}
.tabs{display:flex;justify-content:center;gap:8px;padding:6px 20px 14px;flex-wrap:wrap}
.tbtn{background:var(--card);border:1px solid var(--bd);color:var(--tm);padding:9px 22px;border-radius:50px;font-size:.92rem;font-weight:500;cursor:pointer;transition:all .3s}
.tbtn:hover{background:var(--hv);color:var(--tx);border-color:var(--pri)}
.tbtn.on{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 4px 16px rgba(99,102,241,.4)}
.main{max-width:800px;margin:0 auto;padding:0 20px 40px}
.pnl{display:none;animation:fi .3s ease}
.pnl.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.cd{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:22px;margin-bottom:14px}
.cd h3{font-size:1.1rem;margin-bottom:12px}
.sr{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}
.sr:last-child{border-bottom:none}
.slb{color:var(--tm);font-size:.88rem}
.sc select{background:var(--bg);border:1px solid var(--bd);color:var(--tx);padding:6px 10px;border-radius:8px;font-size:.88rem;outline:none}
.sc select:focus{border-color:var(--pri)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 26px;border:none;border-radius:12px;font-size:.92rem;font-weight:600;cursor:pointer;transition:all .2s;color:#fff}
.btn:active{transform:scale(.97)}
.bp{background:linear-gradient(135deg,var(--pri),#4f46e5);box-shadow:0 4px 16px rgba(99,102,241,.3)}
.bp:hover{box-shadow:0 6px 24px rgba(99,102,241,.5);transform:translateY(-1px)}
.bo{background:transparent;border:1px solid var(--bd);color:var(--tm)}
.bo:hover{border-color:var(--pri);color:var(--priL)}
.bf{width:100%}
.bg{display:flex;gap:10px;margin-top:14px}
.bg .btn{flex:1}
.td{text-align:center;padding:14px}
.tt{font-size:2.8rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--priL);text-shadow:0 0 30px rgba(99,102,241,.3)}
.ts{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.76rem;font-weight:600;margin-top:4px}
.ts.r{background:rgba(34,197,94,.15);color:var(--ok)}
.sd{width:7px;height:7px;border-radius:50%;background:var(--bd);transition:background .2s}
.sd.c{background:var(--ok)}.sd.w{background:var(--err)}.sd.n{background:var(--pri);box-shadow:0 0 8px var(--pri);transform:scale(1.3)}
.splay{display:flex;gap:20px;min-height:420px;align-items:stretch}
.sside{width:180px;flex-shrink:0;display:flex;flex-direction:column;justify-content:space-between;padding:10px 0}
.sside-timer{text-align:center}
.sp{display:flex;gap:4px;margin:10px 0;flex-wrap:wrap;justify-content:center}
.smain{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.sh{color:var(--tm);font-size:.85rem;margin-bottom:4px;text-align:center}
.ss{font-size:3.5rem;font-weight:800;letter-spacing:4px;margin:8px 0;text-shadow:0 4px 20px rgba(0,0,0,.3);user-select:none;transition:all .15s}
.sbs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:400px}
.sb2{padding:16px 12px;border:2px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx);font-size:1.5rem;font-weight:700;cursor:pointer;transition:all .15s;min-height:64px;display:flex;align-items:center;justify-content:center}
.sb2:hover{border-color:var(--pri);background:rgba(99,102,241,.1);transform:scale(1.05)}
.sb2.cf{border-color:var(--ok);background:rgba(34,197,94,.2)}
.sb2.wf{border-color:var(--err);background:rgba(239,68,68,.2)}
.sg{display:grid;gap:5px;width:100%;max-width:480px;aspect-ratio:1}
.sc2{display:flex;align-items:center;justify-content:center;background:var(--bg);border:2px solid var(--bd);border-radius:10px;font-size:1.4rem;font-weight:700;cursor:pointer;transition:all .15s;user-select:none;aspect-ratio:1}
.sc2:hover{border-color:var(--pri);background:rgba(99,102,241,.05)}
.sc2.fd{border-color:var(--ok);background:rgba(34,197,94,.12);color:var(--ok);cursor:default;transform:scale(.92);opacity:.6}
.sc2.wf2{border-color:var(--err);background:rgba(239,68,68,.15);animation:sk .4s ease}
.sc2.hc{border-color:var(--warn);box-shadow:0 0 16px rgba(245,158,11,.3)}
@keyframes sk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.stgt{text-align:center;padding:10px;background:var(--bg);border-radius:12px;border:2px solid var(--bd);margin:8px 0}
.stgl{color:var(--tm);font-size:.78rem}
.stgn{font-size:2.2rem;font-weight:800;color:var(--priL)}
.stgh{color:var(--tm);font-size:.72rem;margin-top:2px}
.szsel{display:flex;gap:6px;flex-wrap:wrap}
.szbtn{padding:6px 16px;border:2px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tm);font-weight:600;cursor:pointer;transition:all .2s}
.szbtn:hover{border-color:var(--pri)}
.szbtn.on{border-color:var(--pri);background:rgba(99,102,241,.15);color:var(--priL)}
.aplay{display:flex;gap:20px;min-height:420px;align-items:stretch}
.aside{width:160px;flex-shrink:0;display:flex;flex-direction:column;justify-content:space-between;padding:10px 0}
.ainfo{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.astat{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center}
.astat-v{display:block;font-size:1.5rem;font-weight:700;color:var(--priL)}
.astat-l{display:block;font-size:.72rem;color:var(--tm);margin-top:2px}
.amain{flex:1;display:flex;align-items:center;justify-content:center;min-width:0}
.aarena{width:100%;height:400px;background:var(--bg);border:2px solid var(--bd);border-radius:16px;position:relative;cursor:crosshair;overflow:hidden}
.aim-target{position:absolute;border-radius:50%;cursor:pointer;transition:transform .08s;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.aim-target:hover{transform:scale(1.1)}
.aim-target.hit{pointer-events:none;animation:aimHit .2s ease forwards}
@keyframes aimHit{0%{transform:scale(1);opacity:1}100%{transform:scale(0);opacity:0}}
.aim-boom{position:absolute;pointer-events:none;z-index:10}
.aim-boom-ring{position:absolute;border-radius:50%;border:3px solid;animation:boomRing .4s ease-out forwards}
@keyframes boomRing{0%{transform:scale(0);opacity:1}100%{transform:scale(3);opacity:0}}
.aim-boom-particle{position:absolute;border-radius:50%;animation:boomParticle .5s ease-out forwards}
@keyframes boomParticle{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.aim-score{position:absolute;font-size:1rem;font-weight:700;color:var(--ok);pointer-events:none;animation:aimFloat .5s ease forwards;text-shadow:0 0 8px rgba(34,197,94,.5)}
@keyframes aimFloat{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-30px) scale(.7);opacity:0}}
.mo{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);z-index:1000;align-items:center;justify-content:center}
.mo.sh{display:flex;animation:fi .3s ease}
.md{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:30px;max-width:390px;width:90%;text-align:center}
.md h2{font-size:1.4rem;margin-bottom:5px}
.md .re{font-size:3.2rem;margin:10px 0}
.md .rs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.md .ri{background:var(--bg);border-radius:12px;padding:10px}
.md .ri .v{font-size:1.3rem;font-weight:700;color:var(--priL)}
.md .ri .l{font-size:.76rem;color:var(--tm);margin-top:2px}
.md .st{font-size:1.7rem;margin:8px 0;letter-spacing:4px}
.hl{max-height:280px;overflow-y:auto}
.hi{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid var(--bd);transition:background .2s}
.hi:hover{background:var(--hv)}.hi:last-child{border-bottom:none}
.tb{padding:2px 8px;border-radius:6px;font-size:.7rem;font-weight:600}
.tb.stb{background:rgba(99,102,241,.15);color:var(--priL)}
.tb.schb{background:rgba(34,197,94,.15);color:var(--ok)}
.hinfo{font-size:.78rem;color:var(--tm)}
.hsv{font-weight:700;color:var(--priL)}.hst{font-size:.76rem;color:var(--tm)}
.eh{text-align:center;color:var(--tm);padding:32px}
.eh .ei{font-size:2.2rem;margin-bottom:8px;opacity:.5}
.cdo{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,.9);display:none;align-items:center;justify-content:center;z-index:999}
.cdo.sh{display:flex}
.cdn{font-size:6rem;font-weight:800;color:var(--priL);animation:cp .6s ease}
@keyframes cp{0%{transform:scale(2);opacity:0}50%{transform:scale(.9);opacity:1}100%{transform:scale(1);opacity:1}}
.kh{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.khi{display:flex;align-items:center;gap:4px;font-size:.76rem;color:var(--tm)}
kbd{background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:1px 6px;font-family:inherit;font-size:.76rem}
@media(max-width:700px){.hdr h1{font-size:1.6rem}.splay{flex-direction:column;min-height:auto}.sside{width:100%;flex-direction:row;align-items:center;gap:12px;padding:0;margin-bottom:10px}.sside-timer{display:flex;align-items:center;gap:8px}.stgt{margin:0}.ss{font-size:3rem}.sbs{max-width:340px}.sb2{padding:14px 10px;font-size:1.2rem;min-height:56px}.sg{max-width:320px}.sc2{font-size:1rem}.bg{flex-direction:column}}
</style>
</head>
<body>
<div class="hdr"><h1>🧠 注意力训练中心</h1><p>Stroop 干扰训练 · 舒尔特方格 · 专注力提升</p></div>
<div class="sb">
<div class="si"><div class="sv" id="xSess">0</div><div class="sl">训练次数</div></div>
<div class="si"><div class="sv" id="xTime">0:00</div><div class="sl">累计时长</div></div>
<div class="si"><div class="sv" id="xAcc">-</div><div class="sl">平均正确率</div></div>
<div class="si"><div class="sv" id="xStr">0</div><div class="sl">连续天数</div></div>
</div>
<div class="tabs">
<button class="tbtn on" data-t="stroop" onclick="swTab('stroop')">🎨 Stroop 干扰</button>
<button class="tbtn" data-t="schulte" onclick="swTab('schulte')">📊 舒尔特方格</button>
<button class="tbtn" data-t="aim" onclick="swTab('aim')">🎯 反应射击</button>
<button class="tbtn" data-t="hist" onclick="swTab('hist')">📈 训练记录</button>
</div>
<div class="main">
<div class="pnl on" id="p-stroop">
<div class="cd" id="stroop-set">
<h3>⚙️ 训练设置</h3>
<div class="sr"><span class="slb">干扰模式</span><div class="sc"><select id="sMode"><option value="number">数值干扰 (数字颜色不一致)</option><option value="word">文字干扰 (文字颜色不一致)</option><option value="mixed">混合模式</option></select></div></div>
<div class="sr"><span class="slb">题目数量</span><div class="sc"><select id="sCnt"><option value="10">10 题</option><option value="20" selected>20 题</option><option value="30">30 题</option><option value="50">50 题</option></select></div></div>
<div class="sr"><span class="slb">限时作答</span><div class="sc"><select id="sTmo"><option value="0">不限时</option><option value="3000">3 秒</option><option value="2000">2 秒</option><option value="1500">1.5 秒</option></select></div></div>
<div class="bg"><button class="btn bp bf" onclick="goStroop()">🚀 开始训练</button></div>
</div>
<div class="cd" id="stroop-game" style="display:none">
<div class="splay">
<div class="sside">
<div class="sside-timer"><div class="tt" id="st-timer">00:00.0</div><div class="ts r" id="st-ts">计时中</div></div>
<div class="sp" id="st-prog"></div>
<div class="kh"><span class="khi"><kbd>1</kbd>~<kbd>9</kbd> 快速作答</span><span class="khi"><kbd>Esc</kbd> 结束</span></div>
</div>
<div class="smain">
<div class="sh" id="st-hint"></div>
<div class="ss" id="st-stim"></div>
<div class="sbs" id="st-btns"></div>
</div>
</div>
</div>
</div>
<div class="pnl" id="p-schulte">
<div class="cd" id="sch-set">
<h3>⚙️ 训练设置</h3>
<div class="sr"><span class="slb">网格大小</span><div class="szsel">
<button class="szbtn" data-s="3" onclick="selSz(3)">3×3</button>
<button class="szbtn on" data-s="5" onclick="selSz(5)">5×5</button>
<button class="szbtn" data-s="7" onclick="selSz(7)">7×7</button>
<button class="szbtn" data-s="9" onclick="selSz(9)">9×9</button>
</div></div>
<div class="sr"><span class="slb">内容类型</span><div class="sc"><select id="schType"><option value="number" selected>数字 (1~N)</option><option value="letter">字母 (A~Z)</option><option value="chinese">中文数字</option><option value="color">颜色文字</option></select></div></div>
<div class="sr"><span class="slb">排列顺序</span><div class="sc"><select id="schRev"><option value="0" selected>正序 (从小到大)</option><option value="1">倒序 (从大到小)</option></select></div></div>
<div class="sr"><span class="slb">提示功能</span><div class="sc"><select id="schHint"><option value="0" selected>关闭</option><option value="1">开启 (按 H 键提示)</option></select></div></div>
<div class="bg"><button class="btn bp bf" onclick="goSchulte()">🚀 开始训练</button></div>
</div>
<div class="cd" id="sch-game" style="display:none">
<div class="splay">
<div class="sside">
<div class="sside-timer"><div class="tt" id="sch-timer">00:00.0</div><div class="ts r" id="sch-ts">计时中</div></div>
<div class="stgt">
<div class="stgl">请找到并点击</div>
<div class="stgn" id="sch-tgt">1</div>
<div class="stgh" id="sch-nh"></div>
</div>
<div class="kh"><span class="khi"><kbd>H</kbd> 提示</span><span class="khi"><kbd>Esc</kbd> 结束</span></div>
</div>
<div class="smain" style="justify-content:center">
<div class="sg" id="sch-grid"></div>
</div>
</div>
</div>
</div>
<div class="pnl" id="p-aim">
<div class="cd" id="aim-set">
<div style="display:flex;gap:16px;align-items:flex-start">
<div style="flex:1">
<h3>⚙️ 训练设置</h3>
<div class="sr"><span class="slb">发射模式</span><div class="sc"><select id="aimMode"><option value="1" selected>单球（1个）</option><option value="2">双球（2个）</option><option value="3x3">四球·3×3区域</option><option value="4x4">四球·4×4区域</option><option value="rand">四球·随机</option></select></div></div>
<div class="sr"><span class="slb">击中目标数</span><div class="sc"><select id="aimCnt"><option value="10" selected>10 个</option><option value="20">20 个</option><option value="50">50 个</option><option value="100">100 个</option><option value="150">150 个</option><option value="200">200 个</option><option value="250">250 个</option></select></div></div>
<div class="sr"><span class="slb">目标大小</span><div class="sc"><select id="aimSize"><option value="56">大</option><option value="42" selected>中</option><option value="28">小</option></select></div></div>
<div class="sr"><span class="slb">目标样式</span><div class="sc"><select id="aimStyle"><option value="circle" selected>圆形靶</option><option value="square">方块</option><option value="star">星形</option></select></div></div>
<div class="bg"><button class="btn bp bf" onclick="goAim()">🚀 开始训练</button></div>
</div>
<div style="width:200px;flex-shrink:0">
<h3 style="font-size:.95rem">🏆 排行榜</h3>
<div id="aim-lb" style="max-height:340px;overflow-y:auto;margin-top:8px"></div>
</div>
</div>
</div>
<div class="cd" id="aim-game" style="display:none">
<div class="aplay">
<div class="aside">
<div class="sside-timer"><div class="tt" id="aim-timer">00:00.0</div><div class="ts r" id="aim-ts">准备中</div></div>
<div class="ainfo">
<div class="astat" style="border-color:var(--warn)"><span class="astat-v" id="aim-score" style="color:var(--warn);font-size:1.2rem">0</span><span class="astat-l">当前得分</span></div>
<div class="astat"><span class="astat-v" id="aim-hit">0</span><span class="astat-l">命中</span></div>
<div class="astat"><span class="astat-v" id="aim-miss">0</span><span class="astat-l">失误</span></div>
<div class="astat"><span class="astat-v" id="aim-avg">-</span><span class="astat-l">平均反应</span></div>
</div>
<div class="kh"><span class="khi"><kbd>Esc</kbd> 结束</span></div>
</div>
<div class="amain">
<div class="aarena" id="aim-arena"></div>
</div>
</div>
</div>
</div>
<div class="pnl" id="p-hist">
<div class="cd"><h3>📋 训练历史</h3><div class="hl" id="hist-list"></div></div>
<div class="bg"><button class="btn bo bf" onclick="clrHist()">🗑️ 清除所有记录</button></div>
</div>
</div>
<div class="mo" id="modal">
<div class="md">
<div class="re" id="m-emoji">🎉</div>
<h2 id="m-title">训练完成！</h2>
<div class="st" id="m-stars"></div>
<div class="rs" id="m-stats"></div>
<div class="bg"><button class="btn bo" onclick="closeM()">返回</button><button class="btn bp" onclick="replay()">再来一次</button></div>
</div>
</div>
<div class="cdo" id="cdown"><div class="cdn" id="cdn-n">3</div></div>
<script>
const COLORS=[
{name:"红",hex:"#ef4444",v:1},{name:"橙",hex:"#f97316",v:2},{name:"黄",hex:"#eab308",v:3},
{name:"绿",hex:"#22c55e",v:4},{name:"蓝",hex:"#3b82f6",v:5},{name:"紫",hex:"#a855f7",v:6},
{name:"粉",hex:"#ec4899",v:7},{name:"白",hex:"#e2e8f0",v:8},{name:"灰",hex:"#94a3b8",v:9}
];
const NUMS=["1","2","3","4","5","6","7","8","9"];
const LETTERS="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const CN=["零","一","二","三","四","五","六","七","八","九","十",
"十一","十二","十三","十四","十五","十六","十七","十八","十九","二十",
"二十一","二十二","二十三","二十四","二十五","二十六","二十七","二十八","二十九","三十",
"三十一","三十二","三十三","三十四","三十五","三十六","三十七","三十八","三十九","四十",

// Aim Lab
let AIM=false,aimMode,aimTotal,aimHit,aimMiss,aimTimes,aimT0,aimTI,aimSize,aimStyle,aimSpawned,aimScore;
let aimLB=JSON.parse(localStorage.getItem("at_lb")||"[]");
function aimCoeff(rt){
if(rt<=100)return 2.0;
if(rt<=200)return 1.8;
if(rt<=300)return 1.5;
if(rt<=400)return 1.2;
if(rt<=500)return 1.0;

}
function aimFmtScore(n){return n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"K":String(n);}
function renderAimLB(){

function getFieldCount(){
if(aimMode==="1")return 1;
if(aimMode==="2")return 2;

}
function spawnOne(){
if(!AIM||aimSpawned>=aimTotal)return;
aimSpawned++;
const arena=document.getElementById("aim-arena");
const aw=arena.offsetWidth,ah=arena.offsetHeight;
const pos=getOnePos(arena,aw,ah);
createTarget(arena,pos.x,pos.y);
}
function getOnePos(arena,aw,ah){
const sz=aimSize,pad=8;
let gridN=0;
if(aimMode==="3x3")gridN=3;
else if(aimMode==="4x4")gridN=4;
if(gridN>0){
const areaW=sz*gridN,areaH=sz*gridN;
const ox=(aw-areaW)/2,oy=(ah-areaH)/2;
let x,y,ok,tries=0;
do{
const ci=Math.floor(Math.random()*gridN),ri=Math.floor(Math.random()*gridN);
x=ox+ci*sz+Math.random()*(sz-sz*.3);
y=oy+ri*sz+Math.random()*(sz-sz*.3);
if(x<pad)x=pad;if(y<pad)y=pad;
if(x+sz>aw-pad)x=aw-pad-sz;if(y+sz>ah-pad)y=ah-pad-sz;
ok=!overlaps(arena,x,y,sz);
tries++;
}while(!ok&&tries<30);
return{x,y};
}else{
let x,y,ok,tries=0;
do{
x=pad+Math.random()*(aw-sz-pad*2);
y=pad+Math.random()*(ah-sz-pad*2);
ok=!overlaps(arena,x,y,sz);
tries++;
}while(!ok&&tries<30);
return{x,y};
}
}
function overlaps(arena,x,y,sz){
const targets=arena.querySelectorAll(".aim-target:not(.hit)");
for(const t of targets){
const tx=parseInt(t.style.left),ty=parseInt(t.style.top);
const dx=tx-x,dy=ty-y;
if(Math.sqrt(dx*dx+dy*dy)<sz+8)return true;
}
return false;
}
function createTarget(arena,x,y){
const t=document.createElement("div");
t.className="aim-target";
const sz=aimSize;
t.style.left=x+"px";
t.style.top=y+"px";
t.style.width=sz+"px";
t.style.height=sz+"px";
if(aimStyle==="circle"){
t.style.borderRadius="50%";
t.style.background="radial-gradient(circle at 35% 35%,#ff6b6b,#e74c3c,#c0392b)";

}else{
t.style.borderRadius="50%";
t.style.background="conic-gradient(from 0deg,#f59e0b,#eab308,#22c55e,#3b82f6,#a855f7,#ec4899,#f59e0b)";

t.appendChild(inner);
}
const spawnTime=performance.now();
t.onclick=function(e){
e.stopPropagation();
if(!AIM||t.classList.contains("hit"))return;
const rt=Math.round(performance.now()-spawnTime);
aimTimes.push(rt);
aimHit++;
const coeff=aimCoeff(rt);
const pts=Math.round(10000*coeff);
aimScore+=pts;
document.getElementById("aim-hit").textContent=aimHit;
const avg=Math.round(aimTimes.reduce((a,b)=>a+b,0)/aimTimes.length);
document.getElementById("aim-avg").textContent=avg+"ms";
document.getElementById("aim-score").textContent=aimFmtScore(aimScore);
t.classList.add("hit");
spawnBoom(arena,x+sz/2,y+sz/2,sz);
const scoreEl=document.createElement("div");
scoreEl.className="aim-score";
scoreEl.textContent="+"+aimFmtScore(pts)+" ("+coeff.toFixed(1)+"×)";
scoreEl.style.left=x+"px";
scoreEl.style.top=(y-5)+"px";
arena.appendChild(scoreEl);
setTimeout(()=>{t.remove();scoreEl.remove();},200);
if(aimHit>=aimTotal){setTimeout(finishAim,300);}
else{setTimeout(spawnOne,80);}
};
arena.appendChild(t);
}
function spawnBoom(arena,cx,cy,sz){
const boom=document.createElement("div");
boom.className="aim-boom";
boom.style.left=cx+"px";boom.style.top=cy+"px";
const ring=document.createElement("div");
ring.className="aim-boom-ring";
ring.style.width=sz+"px";ring.style.height=sz+"px";
ring.style.left=-sz/2+"px";ring.style.top=-sz/2+"px";
ring.style.borderColor=aimStyle==="circle"?"#ff6b6b":aimStyle==="square"?"#818cf8":"#f59e0b";
boom.appendChild(ring);
for(let i=0;i<8;i++){
const p=document.createElement("div");
p.className="aim-boom-particle";
const angle=i*(Math.PI*2/8);
const dist=20+Math.random()*20;
const pSz=4+Math.random()*4;
p.style.width=pSz+"px";p.style.height=pSz+"px";
p.style.left=-pSz/2+"px";p.style.top=-pSz/2+"px";
p.style.background=aimStyle==="circle"?"#ff6b6b":aimStyle==="square"?"#818cf8":"#f59e0b";
p.style.setProperty("--dx",Math.cos(angle)*dist+"px");
p.style.setProperty("--dy",Math.sin(angle)*dist+"px");
p.style.animation="boomParticle .4s ease-out forwards";
boom.appendChild(p);
}
arena.appendChild(boom);
setTimeout(()=>boom.remove(),500);
}

document.getElementById("m-title").textContent=title;
document.getElementById("m-stars").textContent=stars;
document.getElementById("m-stats").innerHTML="<div class='ri'><div class='v' style='color:var(--warn)'>"+aimFmtScore(aimScore)+"</div><div class='l'>总得分</div></div><div class='ri'><div class='v'>"+acc+"%</div><div class='l'>命中率 "+aimHit+"/"+(aimHit+aimMiss)+"</div></div><div class='ri'><div class='v'>"+avg+"ms</div><div class='l'>平均反应</div></div><div class='ri'><div class='v'>"+(rank>0?"#"+rank:"-")+"</div><div class='l'>排行榜排名</div></div>";
document.getElementById("modal").classList.add("sh");
document.getElementById("aim-set").style.display="block";document.getElementById("aim-game").style.display="none";
}
function saveR(r){
hist.unshift(r);if(hist.length>100)hist.pop();
localStorage.setItem("at_h",JSON.stringify(hist));
nSess++;tTime+=r.raw;localStorage.setItem("at_s",nSess);localStorage.setItem("at_t",tTime);
updStreak();updStats();renderHist();
}
function renderHist(){
const c=document.getElementById("hist-list");
if(!hist.length){c.innerHTML="<div class='eh'><div class='ei'>📭</div><p>还没有训练记录</p><p style='font-size:.82rem;margin-top:4px'>完成训练后这里会显示记录</p></div>";return;}
c.innerHTML=hist.map(r=>{
const d=new Date(r.date);const ds=(d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
const bg=r.type==="stroop"?"<span class='tb stb'>Stroop</span>":r.type==="schulte"?"<span class='tb schb'>舒尔特</span>":"<span class='tb' style='background:rgba(245,158,11,.15);color:#f59e0b'>反应射击</span>";
let info;
if(r.type==="stroop") info=(r.mode==="number"?"数值":r.mode==="word"?"文字":"混合")+" · "+r.total+"题";
else if(r.type==="schulte") info=r.size+" · "+(r.ctype==="number"?"数字":r.ctype==="letter"?"字母":r.ctype==="chinese"?"中文":"颜色")+(r.rev?" · 倒序":"");
else info=r.total+"目标 · 命中"+r.hit;
const sc=r.acc||r.eff;
return "<div class='hi'><div style='display:flex;align-items:center;gap:10px'>"+bg+"<div><div style='font-size:.9rem;font-weight:500'>"+info+"</div><div class='hinfo'>"+ds+"</div></div></div><div style='text-align:right'><div class='hsv'>"+sc+"%</div><div class='hst'>"+r.tt+"</div></div></div>";
}).join("");
}
function clrHist(){if(!confirm("确定清除所有记录？"))return;hist.length=0;nSess=0;tTime=0;streak=0;lDate="";["at_h","at_s","at_t","at_k","at_d"].forEach(k=>localStorage.removeItem(k));updStats();renderHist();}
function closeM(){document.getElementById("modal").classList.remove("sh");}
function replay(){closeM();if(curReplay)curReplay();}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeM();});
</script>
